name: Code Review

on:
  workflow_call:

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out
            (as a detached HEAD) in the current working directory.

            Focus on:
            - Correctness bugs and edge cases introduced by this diff
            - Security implications
            - Adherence to any project CLAUDE.md guidelines
            - Commit subject wording (see below)
            - Private-system identifiers in commit messages or the PR body (see below)

            Post inline comments on specific lines where you find real issues.
            Skip pedantic nitpicks and pre-existing issues not introduced by
            this diff.

            Also check every commit's subject line. Get the full,
            untruncated list with:
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits --jq '.[].commit.message'`
            (the PR's own GraphQL `commits` field truncates long subjects
            with an ellipsis, so don't use `gh pr view --json commits` for
            this).

            For every commit whose type is `feat`, `fix`, or `perf` (or that
            has a `!` after the type, or a `BREAKING CHANGE:` footer) - these
            are the only types that ship in the customer-facing changelog -
            the subject must read as the user-visible effect, not the
            internal mechanism. Flag it if the subject:
            - names a function, option key, filename, or shortcode/hook name, or
            - otherwise describes an implementation detail (a data format, an
              API/library call, a variable) that a non-technical changelog
              reader wouldn't recognize as a symptom.
            Exception: if the repo has `bin/draft-changelog.php`, a technical
            subject paired with a `Release-Note:` trailer is fine - check for
            that file before flagging. A subject issue isn't tied to a diff
            line, so raise it in the general review body instead of an inline
            comment: cite the commit's short SHA, its current subject, and a
            corrected wording.

            Also check the same commit messages, and the PR body, for a
            reference to a private system - a Help Scout ticket number, an
            internal doc/wiki link, a Slack thread, or anything else an
            outside reader on GitHub couldn't follow. A public WP.org forum
            thread is fine to cite. This is a judgment call ("would an
            outside reader recognize what this points to?"), not a fixed
            pattern - flag it in the general review body the same way as a
            subject-wording issue, citing the commit or the PR body and what
            to remove or generalize it to.

            Then submit a formal review. This is mandatory and is the only
            thing that records the outcome: the run is NOT complete until a
            `gh pr review` call has succeeded, even when the diff is clean and
            you posted no inline comments. Saying "nothing to flag" in your
            final message instead of submitting a review counts as a failed
            run.

            Write the review body to `/tmp/review-body.md` with the Write
            tool, then submit it with a single Bash call:
            - If you posted inline comments, or flagged a commit subject or a
              private-system reference (real issues were found either way):
              `gh pr review ${{ github.event.pull_request.number }} --comment --body-file /tmp/review-body.md`
              Do NOT approve, since issues were found.
            - If you found nothing worth flagging:
              `gh pr review ${{ github.event.pull_request.number }} --approve --body-file /tmp/review-body.md`
              noting that the diff looks clean.
            A plain comment review still shows up as "not approved" without
            a hard block, which is what we want here.

            Always pass the PR number explicitly as
            ${{ github.event.pull_request.number }}, do not omit it or rely on
            branch inference, since the checkout is a detached HEAD. Use
            `--body-file`, not an inline `--body`, and do not pipe, heredoc, or
            otherwise assemble the command through an intermediate shell step:
            only `gh pr review ...` itself is permitted, so anything else is
            denied outright and you get no second chance to submit.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*)"

      # The action exits 0 whether or not Claude actually submitted anything,
      # so a dropped review used to look like a passing check. These two steps
      # surface the cause and then hard-fail. Both are skipped when the action
      # bailed out before running Claude (no execution file), which is the
      # normal "workflow file differs from the default branch" case on a PR
      # that adds or edits the workflow itself.
      - name: Report blocked tool calls
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '
            [ .[]? | select(.type == "result") | (.permission_denials // [])[] ]
            | if length == 0 then "No tool calls were blocked."
              else
                "Blocked tool calls (\(length)):",
                ( .[] | "  - \(.tool_name // "?"): "
                    + ((.tool_input.command // (.tool_input | tostring)) | tostring | .[0:300]) )
              end
          ' "$EXECUTION_FILE"

      - name: Verify a review was submitted
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          # Inline comments each create their own body-less review, so require
          # a review carrying an actual summary body to count as submitted.
          # --slurp can't be combined with gh's own --jq, so pipe to jq.
          count=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --slurp | jq '
            [ .[][]
              | select((.user.login // "") == "claude[bot]")
              | select((.submitted_at // "") >= $ENV.SINCE)
              | select((.body // "") != "")
            ] | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::Claude ran but submitted no review on PR #$PR. See the blocked tool calls above; re-run this job after fixing the cause."
            exit 1
          fi
          echo "Review submitted ($count this run)."
