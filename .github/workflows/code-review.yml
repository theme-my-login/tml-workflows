name: Code Review

on:
  workflow_call:

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the review can blame a line before calling it
          # pre-existing, rather than guessing from the diff alone.
          fetch-depth: 0

      # Without this the review job has no vendor/ tree, so a question about
      # how a dependency actually behaves (WP core's own auth/pluggable
      # functions, most often) can't be answered from inside the job and gets
      # raised as an unverifiable concern on every re-run, permanently
      # withholding the approving review branch protection requires. Only the
      # dependency *sources* are needed, not a runnable toolchain, so scripts
      # and plugins are both skipped: unlike test.yml this job inherits
      # secrets, and a plugin can self-authorize through the PR's own
      # config.allow-plugins, so neither may execute here. The runner's own
      # PHP is used whatever a repo pins, and a failure degrades to no vendor/
      # rather than failing the review.
      - name: Install PHP dependencies
        if: hashFiles('composer.json') != ''
        continue-on-error: true
        run: composer install --prefer-dist --no-progress --no-scripts --no-plugins --ignore-platform-reqs

      # The conventions the review enforces live in the org-wide default
      # CONTRIBUTING.md in theme-my-login/.github, which is not part of any
      # repo's own checkout - no repo in the family carries its own copy. With
      # it fetched here the review can hold a PR to the real document instead
      # of to a paraphrase in the prompt that silently drifts from it. That
      # repo is public, so this needs no token.
      - name: Fetch org contribution guidelines
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/CONTRIBUTING.md" \
            https://raw.githubusercontent.com/theme-my-login/.github/main/CONTRIBUTING.md

      - id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out
            (as a detached HEAD) in the current working directory.

            Focus on:
            - Correctness bugs and edge cases introduced by this diff
            - Security implications
            - Adherence to the written conventions (see below)
            - Commit subject wording (see below)
            - Private-system identifiers in commit messages or the PR body (see below)
            - Fixup commits that undo earlier same-PR changes (see below)

            Post inline comments on specific lines where you find real issues.
            Skip pedantic nitpicks and pre-existing issues not introduced by
            this diff.

            The full git history is checked out and `git log`, `git show`,
            `git blame` and `git diff` are available. Use `git blame` before
            treating something as pre-existing or as a deliberate earlier
            decision - it is the only way to tell whether the line you are
            about to flag arrived with this PR or has been there for a year.

            If the PR body or a commit references an issue with `Fixes #N` or
            `Closes #N`, read it:
            `gh api repos/${{ github.repository }}/issues/<N> --jq '{title, body}'`
            and check the change actually addresses what was reported, not
            merely that the diff is internally consistent. A fix that is
            correct but solves a different problem than the one filed is worth
            raising.

            You have no network access, but if the repo has a `composer.json`
            its `vendor/` tree was installed before this run, so every
            third-party dependency's real source is on disk and readable with
            Read/Grep/Glob - including WordPress core itself, under
            `vendor/roots/wordpress-no-content/`, for the repos that depend on
            it. Read that source before raising any concern about how a
            dependency behaves. Do not report a concern you were unable to
            confirm: "worth verifying, I couldn't check core's implementation"
            tells the author nothing actionable and withholds approval on
            every re-run, since the next run can't confirm it either. Either
            confirm it against `vendor/` and report it as a real finding, or
            leave it out.

            The conventions this family is held to are written down, not
            something to infer from the surrounding code. Read both before
            reviewing:
            - `${{ runner.temp }}/CONTRIBUTING.md` - the org-wide commit and
              PR conventions. No repo carries its own copy, so this is the
              source of truth for every one of them.
            - The repo's own `CLAUDE.md`, if it has one - architecture,
              naming, and the constraints specific to this codebase.
            Where this prompt summarizes a rule from either file, the file
            wins: it is current and this prompt is a paraphrase.

            Also check every commit's subject line. Get the full,
            untruncated list with:
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits --jq '.[].commit.message'`
            (the PR's own GraphQL `commits` field truncates long subjects
            with an ellipsis, so don't use `gh pr view --json commits` for
            this).

            Check each commit's type against CONTRIBUTING.md's own table
            first - `fix` in particular is reserved for user-facing bug fixes,
            so a fix to CI, build tooling, or a distribution listing is the
            wrong type even though it fixes something, and the wrong type puts
            a commit in the changelog (or keeps it out) incorrectly.

            For every commit whose type is `feat`, `fix`, or `perf` (or that
            has a `!` after the type, or a `BREAKING CHANGE:` footer) - these
            are the only types that ship in the customer-facing changelog -
            the subject must read as the user-visible effect, not the
            internal mechanism. Flag it if the subject:
            - names a function, option key, filename, or shortcode/hook name, or
            - otherwise describes an implementation detail (a data format, an
              API/library call, a variable) that a non-technical changelog
              reader wouldn't recognize as a symptom.
            Exception: if the repo has `bin/draft-changelog.php`, a technical
            subject paired with a `Release-Note:` trailer is fine - check for
            that file before flagging. A subject issue isn't tied to a diff
            line, so raise it in the general review body instead of an inline
            comment: cite the commit's short SHA, its current subject, and a
            corrected wording.

            Also check the same commit messages, and the PR body, for a
            reference to a private system - a Help Scout ticket number, an
            internal doc/wiki link, a Slack thread, or anything else an
            outside reader on GitHub couldn't follow. A public WP.org forum
            thread is fine to cite. This is a judgment call ("would an
            outside reader recognize what this points to?"), not a fixed
            pattern - flag it in the general review body the same way as a
            subject-wording issue, citing the commit or the PR body and what
            to remove or generalize it to.

            Also check whether this PR carries fixup commits that should have
            been squashed before opening it, using the commit list you
            already fetched above:
            - Any subject literally starting with `fixup!` or `squash!` (the
              markers `git commit --fixup`/`--squash` produce) is always worth
              flagging - these are meant to be squashed via
              `git rebase --autosquash` before the PR is opened, not merged as
              separate commits.
            - More generally, a commit that undoes a change an earlier commit
              in this same PR just made - it adds a line/block that a later
              commit removes or reverts, with no substantive change to that
              code in between - is the same problem even without an explicit
              fixup marker: the two commits should have been one, or the
              earlier one should never have been committed as-is. Read each
              commit's own diff (not the PR's cumulative diff) with one
              `git log --patch ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}`
              and compare each commit's additions/removals against earlier
              commits' in this same PR.
              Use judgment: a commit that legitimately revises, extends, or
              replaces earlier in-PR work (not just blindly reverting it) is
              normal iterative development and should NOT be flagged - only
              flag a straight undo that adds no new value.
            Raise any hit in the general review body (not inline, since it
            spans multiple commits), citing both short SHAs and, for the
            explicit-marker case, that an interactive rebase should squash
            them; for the semantic case, what the later commit undoes.

            Then submit a formal review. This is mandatory and is the only
            thing that records the outcome: the run is NOT complete until a
            `gh pr review` call has succeeded, even when the diff is clean and
            you posted no inline comments. Saying "nothing to flag" in your
            final message instead of submitting a review counts as a failed
            run.

            Write the review body to `/tmp/review-body.md` with the Write
            tool, then submit it with a single Bash call:
            - If you posted inline comments, or flagged a commit subject or a
              private-system reference (real issues were found either way):
              `gh pr review ${{ github.event.pull_request.number }} --comment --body-file /tmp/review-body.md`
              Do NOT approve, since issues were found.
            - If you found nothing worth flagging:
              `gh pr review ${{ github.event.pull_request.number }} --approve --body-file /tmp/review-body.md`
              noting that the diff looks clean.
            A plain comment review still shows up as "not approved" without
            a hard block, which is what we want here.

            Always pass the PR number explicitly as
            ${{ github.event.pull_request.number }}, do not omit it or rely on
            branch inference, since the checkout is a detached HEAD. Use
            `--body-file`, not an inline `--body`, and do not pipe, heredoc, or
            otherwise assemble the command through an intermediate shell step:
            only `gh pr review ...` itself is permitted, so anything else is
            denied outright and you get no second chance to submit.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Write,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*)"

      # The action exits 0 whether or not Claude actually submitted anything,
      # so a dropped review used to look like a passing check. These two steps
      # surface the cause and then hard-fail. Both are skipped when the action
      # bailed out before running Claude (no execution file), which is the
      # normal "workflow file differs from the default branch" case on a PR
      # that adds or edits the workflow itself.
      - name: Report blocked tool calls
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '
            [ .[]? | select(.type == "result") | (.permission_denials // [])[] ]
            | if length == 0 then "No tool calls were blocked."
              else
                "Blocked tool calls (\(length)):",
                ( .[] | "  - \(.tool_name // "?"): "
                    + ((.tool_input.command // (.tool_input | tostring)) | tostring | .[0:300]) )
              end
          ' "$EXECUTION_FILE"

      - name: Verify a review was submitted
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          # Inline comments each create their own body-less review, so require
          # a review carrying an actual summary body to count as submitted.
          # --slurp can't be combined with gh's own --jq, so pipe to jq.
          count=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --slurp | jq '
            [ .[][]
              | select((.user.login // "") == "claude[bot]")
              | select((.submitted_at // "") >= $ENV.SINCE)
              | select((.body // "") != "")
            ] | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::Claude ran but submitted no review on PR #$PR. See the blocked tool calls above; re-run this job after fixing the cause."
            exit 1
          fi
          echo "Review submitted ($count this run)."
